<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nibble</title>
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="../media/scene.css">
<style>
  /* ============================================================
     展开层样式 —— 移植自 media/panel.html 的内联样式（v0.3 面板窗口删除，
     DOM/样式并入本页面）。原 html,body 背景规则改为 #full：
     body 本身必须保持透明（紧凑态悬浮在桌面上）。
     ============================================================ */
  :root { --bg:#171210; --panel:#211a15; --line:#3f3026; --core:#d8c08a; --hearth:#FFB86B; --pulse:#FF6B6B; --text:#efe3d2; --dim:#9a8b78; }
  #full {
    height:100%; color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Consolas, "JetBrains Mono", monospace;
    /* 背景画在 #full 上：三个视图共享同一张「像素坐标纸」，切视图时背景完全连续 */
    background-color:var(--bg);
    background-image:
      radial-gradient(130% 50% at 50% 0%, rgba(226,160,96,.10), rgba(0,0,0,0) 74%),
      linear-gradient(rgba(240,225,200,.05) 1px, rgba(0,0,0,0) 1px),
      linear-gradient(90deg, rgba(240,225,200,.05) 1px, rgba(0,0,0,0) 1px);
    background-size:100% 100%, 28px 28px, 28px 28px;
  }
  canvas { display:block; image-rendering:pixelated; }
  /* 战利品提示 = 像素横幅（样式原样移植） */
  #toast { position:fixed; left:50%; top:42px; transform:translateX(-50%);
    display:none; align-items:center; gap:10px; max-width:min(460px, 92vw); padding:8px 12px;
    background:rgba(12,10,9,.95); border:2px solid #8a8a8a;
    box-shadow:0 0 0 2px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.5);
    z-index:60; pointer-events:none; }
  #toast.show { display:flex; }
  #toast canvas { width:24px; height:24px; flex:0 0 auto; }
  #toastText { font-family:'NibblePixel', ui-monospace, monospace; font-size:12px; line-height:14px;
    color:#f2e8d6; min-width:0; }
  #toastText .story { display:block; font-size:12px; color:#9a8f80; margin-top:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .stage.shake { animation:shake .16s ease-in-out 3; }
  @keyframes goldpulse { 0%,100%{box-shadow:0 0 0 1px rgba(78,205,196,.06), 0 8px 24px rgba(0,0,0,.35)}
    50%{box-shadow:0 0 26px 5px rgba(255,215,0,.45)} }
  .stage.gold { animation:goldpulse 1s ease-in-out 2; }

  /* —— 武器库 / 怪物库视图（原样移植）—— */
  #arsenalView, #bestiaryView {
    padding:38px 12px 10px;
    font-family:'NibblePixel', ui-monospace, monospace; font-size:12px; line-height:16px;
  }
  .wcell.seen { opacity:.72; }
  .abar { display:flex; gap:2px; height:14px; margin:0 0 9px; padding:2px;
    background:#100c0a; border:2px solid #2e231c; }
  .abar > span { flex:1 1 0; background:#241a15; overflow:hidden; }
  .abar > span > i { display:block; height:100%; width:0%; transition:width .3s ease; }
  .alegend { display:flex; flex-wrap:wrap; align-items:center; gap:5px 12px; font-size:12px;
    color:var(--dim); margin-bottom:10px; }
  .alegend .atotal { color:var(--core); font-size:12px; }
  .achip { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .achip > i, .aghead > i { width:8px; height:8px; display:inline-block; }
  .alegend .apity { margin-left:auto; }
  .agroup { margin-bottom:12px; }
  .aghead { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin:0 0 6px 2px; }
  .agrid { display:grid; grid-template-columns:repeat(auto-fill, 52px); gap:5px; justify-content:start; }
  .wcell { position:relative; box-sizing:border-box; aspect-ratio:1; border:2px solid #2e231c;
    background:#1c1512; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .wcell canvas { width:48px; height:48px; }
  .wcell.owned { background:#241b16; border-color:#3f3026; }
  .wcell.locked { opacity:.42; border-color:#241c17; }
  .wcell.sel { border-color:var(--core); box-shadow:0 0 0 2px rgba(216,192,138,.26); }
  .wcell .dot { position:absolute; right:3px; top:3px; width:6px; height:6px; }
  .wcell .eq { position:absolute; left:4px; top:1px; font-size:10px; line-height:1;
    font-family:ui-monospace, monospace; color:var(--core); }
  .wcell .cnt { position:absolute; right:4px; bottom:1px; font-size:10px; line-height:1;
    font-family:ui-monospace, monospace; color:var(--dim); text-shadow:0 1px 0 #000; }
  .adetail { display:flex; flex-wrap:wrap; gap:10px; align-items:center; box-sizing:border-box;
    background:var(--panel); border:2px solid var(--line); padding:9px 12px; margin-bottom:11px; }
  .adetail canvas { width:48px; height:48px; flex:0 0 auto; }
  .atext { flex:1 1 180px; min-width:0; }
  .adetail .aname { font-size:12px; color:#f6e9d4; }
  .adetail .astory { font-size:12px; line-height:1.7; color:var(--dim); margin-top:2px; }
  .abtns { display:flex; gap:6px; flex:0 0 auto; flex-wrap:wrap; }
  .abtns button { padding:2px 9px; font-size:12px; }
  .abtns button:disabled { opacity:.5; cursor:default; border-color:var(--line); color:var(--dim); }
  .wpn { color:var(--dim); }
  button { background:#2a1a12; color:#ecdfcc; border:2px solid #4a2a18; border-bottom-width:4px;
    padding:4px 11px; font-family:inherit; font-size:12px; cursor:pointer; }
  button:hover { border-color:#8a5a2a; color:#ffe9c8; }
  button:active { transform:translateY(2px); border-bottom-width:2px; }
  /* 「在标签页打开」是 IDE 面板专属：桌面版无意义，永久隐藏 */
  #expand { display:none !important; }
  .hidden { display:none !important; }

  /* —— 桌面版小窗适配（窗口恒定 300×220，位于本 <style> 内以覆盖 scene.css）—— */
  /* nav 悬浮菜单避让自绘标题栏（32px） */
  .nav { top: 40px; right: 8px; }
  .navBtn { width: 26px; height: 22px; }
  .navMenu { min-width: 96px; }
</style>
</head>
<body>
  <!-- ==================== 紧凑层：迷你战斗舞台（穿透） ==================== -->
  <div id="compact">
    <div id="o-scene">
      <canvas id="o-bg"></canvas>
      <div id="o-quick">
        <button id="o-open-arsenal" title="武器库">武器库</button>
        <button id="o-open-bestiary" title="怪物库">怪物库</button>
      </div>
      <div id="o-einfo">
        <span id="o-ename">—</span>
        <span id="o-ehpwrap"><i id="o-ehp"></i></span>
      </div>
      <canvas id="o-enemy" width="24" height="24"></canvas>
      <canvas id="o-player" width="24" height="24" title="点击展开面板 · 滚轮调透明度"></canvas>
      <div id="o-dmg" class="hidden"></div>
    </div>
    <div id="o-hud">
      <span id="o-lv">Lv 1</span>
      <span id="o-expwrap"><i id="o-exp"></i></span>
      <b id="o-combo" class="hidden">×10</b>
      <span id="o-wslot" title="点击打开武器库">
        <canvas id="o-wicon" width="24" height="24"></canvas>
        <em id="o-wname">未装备</em>
      </span>
    </div>
    <div id="o-log">Nibble 待命中…</div>
  </div>

  <!-- ==================== 展开层：完整面板（战斗 / 武器库 / 怪物库） ====================
       注意：不要在这里写 class="hidden"——.hidden 是 !important 规则，
       会永久压过 `body:not(.full) #full{display:none}` 的显隐控制（曾导致展开后全黑）。
       显隐只由 body.full 类 + overlay.js 的 setMode 控制 -->
  <div id="full">
    <div id="o-titlebar" title="按住拖动">
      <span class="tb-title">Nibble · 像素小生物</span>
      <input id="o-opacity" type="range" min="30" max="100" step="5" value="100" title="窗口透明度">
      <button id="o-collapse" title="关闭面板，回到战斗舞台">─</button>
    </div>
    <div id="fullBody">
      <div id="toast"><canvas id="toastIcon" width="24" height="24"></canvas><span id="toastText"></span></div>

      <nav class="nav" id="nav">
        <button class="navBtn" id="navBtn" aria-label="菜单" title="菜单：战斗 / 武器库 / 怪物库"><i></i><i></i><i></i></button>
        <div class="navMenu" id="navMenu">
          <button class="navItem on" id="tabBattle">战斗</button>
          <button class="navItem" id="tabArsenal">武器库 <b id="navWpn"></b></button>
          <button class="navItem" id="tabBestiary">怪物库 <b id="navEnemy"></b></button>
        </div>
      </nav>

      <div id="battleView">
        <div class="sceneWrap stage" id="sceneWrap">
          <canvas id="scene"></canvas>

          <div class="hud" id="hud">
            <div class="actor" id="hudPlayer">
              <span class="aname">拾玖 <b id="lv">Lv 1</b><b class="combo hidden" id="comboBadge">×12</b></span>
              <span class="hbar"><i id="expbar"></i></span>
            </div>
            <div class="actor" id="hudEnemy">
              <span class="aname" id="ename">—</span>
              <span class="hbar enemy"><i id="hpbar"></i></span>
            </div>
            <div class="dmg hidden" id="dmg"></div>
          </div>

          <div class="wslotWrap" id="wslotWrap">
            <div class="wslot empty" id="slot" title="点击去武器库选择武器">
              <canvas id="weapon" width="24" height="24"></canvas>
              <span class="ph">?</span>
            </div>
            <span class="wname" id="slotName">未装备</span>
          </div>

          <div class="ops">
            <span class="log" id="log">Nibble 待命中…</span>
            <span class="opsBtns">
              <button id="attack">攻击一次</button>
              <button id="changeWpn">更换武器</button>
              <button id="reset">重置进度</button>
              <button id="expand">在标签页打开</button>
            </span>
            <span class="wmeta wpn" id="atk"></span>
            <span class="wmeta wpn" id="hpnum">--/--</span>
            <span class="wmeta wpn" id="wpn"></span>
          </div>

          <div class="flash hidden" id="flash"></div>
          <div class="comboFx hidden" id="comboFx">
            <div class="comboBan">
              <i class="cbLine"></i>
              <div class="comboTxt"><span>COMBO</span><b id="comboNum">×50</b></div>
              <i class="cbLine"></i>
            </div>
          </div>
        </div>
      </div>

      <div id="arsenalView" class="hidden">
        <div class="abar" id="abar"><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span></div>
        <div class="alegend" id="alegend"></div>
        <div class="adetail" id="adetail">
          <canvas id="adetailIcon" width="24" height="24"></canvas>
          <div class="atext">
            <div class="aname" id="adetailName">—</div>
            <div class="astory" id="adetailStory">点选下方格子，查看这把武器的故事</div>
          </div>
          <div class="abtns" id="adetailBtns">
            <button id="aEquip" class="hidden">装备此武器</button>
            <button id="aAuto" class="hidden">跟随最近获得</button>
          </div>
        </div>
        <div id="agroups"></div>
      </div>
      <div id="bestiaryView" class="hidden">
        <div class="abar" id="bbar"><span><i></i></span><span><i></i></span><span><i></i></span></div>
        <div class="alegend" id="blegend"></div>
        <div class="adetail" id="bdetail">
          <canvas id="bdetailIcon" width="24" height="24"></canvas>
          <div class="atext">
            <div class="aname" id="bdetailName">—</div>
            <div class="astory" id="bdetailStory">点选下方格子，查看这只怪物的「Bug 纪要」</div>
          </div>
        </div>
        <div id="bgroups"></div>
      </div>
    </div>
  </div>

  <script src="../media/pet.js"></script>
  <script src="../media/scene.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
